<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text Aquarium</title>
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/aquarium.css" />
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <div class="brand">Text Aquarium</div>
        <div class="controls">
          <button
            id="btn-boundary"
            type="button"
            aria-pressed="false"
            title="打开边界，让小鱼游到桌面上"
          >
            打开边界
          </button>
          <button id="btn-pause" type="button" aria-pressed="false">暂停</button>
          <button
            id="btn-hunt"
            type="button"
            aria-pressed="false"
            title="开启后，在桌面上拖动框住小鱼，它们就会游回鱼缸"
            disabled
          >
            捞鱼
          </button>
          <button id="btn-settings" type="button" aria-pressed="false">设置</button>
        </div>
      </header>

      <main class="tank" id="tank">
        <canvas id="scene"></canvas>
      </main>

      <footer class="status">
        <span id="status-mode">鱼缸模式 · 边界关闭</span>
        <span id="status-perf">— fps</span>
      </footer>
    </div>

    <section class="panel" id="settings-panel" hidden>
      <h2>设置</h2>
      <div class="row">
        <label for="set-seaweed">海草</label>
        <input id="set-seaweed" type="checkbox" />
      </div>
      <div class="row">
        <label for="set-bubbles">气泡</label>
        <input id="set-bubbles" type="checkbox" />
      </div>
      <div class="row">
        <label for="set-fps" id="set-fps-label">高帧率 60</label>
        <input id="set-fps" type="checkbox" />
      </div>
      <div class="row">
        <label for="set-count">鱼的数量</label>
        <span class="slider">
          <input id="set-count" type="range" min="3" max="8" step="1" />
          <output id="set-count-val" for="set-count">5</output>
        </span>
      </div>
      <div class="row">
        <label for="set-size">鱼的大小</label>
        <span class="slider">
          <input id="set-size" type="range" min="12" max="22" step="1" />
          <output id="set-size-val" for="set-size">15px</output>
        </span>
      </div>
      <div class="row">
        <label for="set-liveliness">活泼程度</label>
        <span class="slider">
          <input id="set-liveliness" type="range" min="0.5" max="2" step="0.1" />
          <output id="set-liveliness-val" for="set-liveliness">普通</output>
        </span>
      </div>
      <div class="row">
        <label for="set-custom">自定义小鱼</label>
        <span class="custom-edit">
          <input
            id="set-custom"
            type="text"
            maxlength="16"
            placeholder="字符造型"
            spellcheck="false"
          />
          <button id="btn-custom-add" type="button">添加</button>
        </span>
      </div>
      <div class="row" id="custom-live" hidden>
        <label>已养</label>
        <span class="custom-live">
          <span id="custom-glyph" class="custom-glyph"></span>
          <button id="btn-custom-dir" type="button">头朝右</button>
          <button id="btn-custom-remove" type="button">移除</button>
        </span>
      </div>
      <div class="row">
        <label>透明层自检</label>
        <button id="btn-tech" type="button">运行</button>
      </div>
      <pre id="tech-out" hidden></pre>
      <p class="hint">
        空格暂停 · Esc 关闭面板。打开边界后小鱼会游到桌面上：鼠标靠近它们会躲开，久放不动它们会好奇地凑过来嘬一嘬。捞鱼模式：按住拖动框住小鱼，它们就会游回鱼缸（Esc 或右键收起渔网）。
      </p>
    </section>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
